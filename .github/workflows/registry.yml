name: registry
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet test --solution tools/OrfCircuits.sln -c Release
      - run: dotnet run --project tools/OrfCircuits -c Release -- validate .
      - name: dist/ is generated, not edited
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- dist/ | grep -q .; then
            echo "::error::dist/ is generated by CI; do not edit it in a pull request."; exit 1; fi
  index:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet run --project tools/OrfCircuits -c Release -- index . --generated-at "$(git log -1 --format=%cI -- circuits schema)"
      - name: Commit index if changed
        run: |
          git diff --quiet -- dist/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.json && git commit -m "Regenerate dist/index.json" && git push
